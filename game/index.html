<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silent Vault — a tiny stealth game</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a14; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    display: block;
    touch-action: none;
    background: #101527;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Silent Vault: sneak past the guards, steal the key and reach the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
